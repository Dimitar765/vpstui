<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vpstui — dashboard</title>
<style>
  :root {
    --bg: #10151a;
    --panel: #171e24;
    --line: #263039;
    --fg: #d7dee5;
    --dim: #74828f;
    --accent: #4ec9a8;
    --bad: #e5736f;
    --warn: #d9a843;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0 0 3rem;
    background: var(--bg); color: var(--fg);
    font: 13px/1.5 var(--mono);
  }
  header {
    display: flex; align-items: baseline; gap: 1rem;
    padding: 1.1rem 1.5rem; border-bottom: 1px solid var(--line);
    position: sticky; top: 0; background: var(--bg); z-index: 2;
  }
  h1 { font-size: 14px; margin: 0; letter-spacing: .06em; text-transform: uppercase; }
  #status { color: var(--dim); font-size: 12px; }
  #status.bad { color: var(--bad); }
  .rate { margin-left: auto; color: var(--dim); font-size: 12px; display: flex; align-items: center; gap: .45rem; }
  select {
    background: var(--panel); color: var(--fg); border: 1px solid var(--line);
    font: inherit; font-size: 12px; padding: .15rem .3rem;
  }
  main { padding: 1.5rem; }
  #sessions, #network, #errors, #perf { display: grid; gap: 1.25rem; }
  /* an author display rule beats the hidden attribute, so undo it explicitly */
  #sessions[hidden], #network[hidden], #errors[hidden], #perf[hidden] { display: none; }
  nav { display: flex; gap: .3rem; padding: 1rem 1.5rem 0; }
  nav button {
    background: none; color: var(--dim); border: 1px solid var(--line); border-bottom: 0;
    font: inherit; font-size: 12px; padding: .3rem .9rem; cursor: pointer;
  }
  nav button:hover { color: var(--fg); }
  nav button.active { color: var(--accent); background: var(--panel); }
  .graph { padding: .8rem .9rem; overflow-x: auto; }
  .graph > svg { display: block; margin: 0 auto; }
  .note { padding: .6rem .9rem 0; color: var(--dim); font-size: 12px; }
  svg text { font: 11px var(--mono); }
  .edge { stroke: #2c3742; }
  .net-box { fill: #1b2530; stroke: var(--accent); }
  .net-label { fill: var(--fg); }
  .ctr-label { fill: var(--dim); }
  .strip-label { fill: var(--dim); }
  .panel { background: var(--panel); border: 1px solid var(--line); }
  .panel > h2 {
    margin: 0; padding: .65rem .9rem; font-size: 13px; font-weight: 600;
    border-bottom: 1px solid var(--line); display: flex; gap: .7rem; align-items: baseline;
  }
  .target { color: var(--dim); font-weight: 400; font-size: 12px; }
  .badge { font-size: 11px; padding: .05rem .45rem; border: 1px solid var(--line); color: var(--dim); }
  .badge.ok { color: var(--accent); border-color: #2c5548; }
  .badge.bad { color: var(--bad); border-color: #5a3230; }
  /* hog/spike are the words Go publishes (internal/perf/rank.go), coloured the
     way the TUI tints the same badge: red is eat-the-box, amber is a jump. */
  .flag { font-size: 11px; padding: .05rem .4rem; border: 1px solid var(--line); margin-right: .3rem; color: var(--dim); }
  .flag.hog { color: var(--bad); border-color: #5a3230; }
  .flag.spike { color: var(--warn); border-color: #57451f; }
  .spark { display: block; }
  .spark-line { fill: none; stroke: var(--accent); stroke-width: 1; }
  .age { margin-left: auto; font-size: 11px; font-weight: 400; color: var(--dim); }
  .age.stale { color: var(--warn); }
  .stats { display: flex; flex-wrap: wrap; gap: .2rem 1.4rem; padding: .7rem .9rem; border-bottom: 1px solid var(--line); font-size: 12px; }
  .stats b { color: var(--fg); font-weight: 600; }
  .stats span { color: var(--dim); }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: .38rem .9rem; border-bottom: 1px solid #1d252c; white-space: nowrap; }
  th { color: var(--dim); font-weight: 400; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
  td.num, th.num { text-align: right; }
  tr:last-child td { border-bottom: 0; }
  .state-running { color: var(--accent); }
  .state-exited { color: var(--bad); }
  .state-other { color: var(--dim); }
  .empty { padding: 1.1rem .9rem; color: var(--dim); }
  .bar { width: 90px; height: 6px; border: 1px solid var(--line); display: inline-block; vertical-align: middle; }
  .bar > i { display: block; height: 100%; background: var(--accent); }
  .bar > i.warm { background: var(--warn); }
  .bar > i.hot { background: var(--bad); }
  .bar.sm { width: 54px; margin-right: .55rem; }
  .dot { stroke: none; }
  .dot.ok { fill: var(--accent); }
  .dot.bad { fill: var(--bad); }
  /* Severity colours mirror the TUI's sevCell: red means error, amber warn. */
  .sev-error { color: var(--bad); }
  .sev-warn { color: var(--warn); }
  .sev-other { color: var(--dim); }
  tr.clickable { cursor: pointer; }
  tr.clickable:hover td { background: #1b2530; }
  td.sig, .err-detail td { white-space: normal; word-break: break-word; }
  .err-detail td { background: #12181e; }
  .err-detail .where { color: var(--dim); font-size: 12px; }
  .err-detail .sample { color: var(--fg); }
  .err-detail .miss { color: var(--dim); }
  /* Tag colours are the TUI's six palette slots (internal/app/tags.go), hex for
     the screen. Both color and fill are set: a label is HTML in the table and
     SVG on the graph ring. An unknown name from a hand-edited tags.json falls
     back to slate in script, so a label never disappears. */
  .tag { border: 1px solid var(--line); padding: .05rem .4rem; margin-right: .45rem; }
  .tag-sky { color: #87afd7; fill: #87afd7; }
  .tag-green { color: #5faf5f; fill: #5faf5f; }
  .tag-amber { color: #ffaf00; fill: #ffaf00; }
  .tag-rose { color: #eb5f5f; fill: #eb5f5f; }
  .tag-violet { color: #afafef; fill: #afafef; }
  .tag-slate { color: #626262; fill: #626262; }
  .docker { color: var(--dim); }
  .copy {
    background: none; border: 1px solid var(--line); color: var(--dim);
    font: inherit; font-size: 11px; padding: .05rem .5rem; margin-left: .6rem; cursor: pointer;
  }
  .copy:hover { color: var(--fg); border-color: #3c4a57; }
</style>
</head>
<body>
<header>
  <h1>vpstui</h1>
  <div id="status">connecting…</div>
  <label class="rate">refresh <select id="rate" title="How often the page re-reads the API"></select></label>
</header>
<nav id="tabs">
  <button type="button" data-tab="sessions">Sessions</button>
  <button type="button" data-tab="perf">Performance</button>
  <button type="button" data-tab="network">Network</button>
  <button type="button" data-tab="errors">Errors</button>
</nav>
<main>
  <div id="sessions"></div>
  <div id="perf" hidden></div>
  <div id="network" hidden></div>
  <div id="errors" hidden></div>
</main>

<template id="tpl-session">
  <section class="panel">
    <h2>
      <span data-name></span>
      <span class="target" data-target></span>
      <span class="badge" data-conn></span>
      <span class="age" data-age></span>
    </h2>
    <div class="stats" data-stats></div>
    <table>
      <thead><tr>
        <th>name</th><th>image</th><th>state</th><th>status</th>
        <th class="num">cpu</th><th class="num">mem %</th><th class="num">mem usage</th>
        <th>perf</th>
      </tr></thead>
      <tbody data-rows></tbody>
    </table>
  </section>
</template>

<template id="tpl-row">
  <tr>
    <td data-name></td><td data-image></td><td data-state></td><td data-status></td>
    <td class="num" data-cpu></td><td class="num" data-mem></td><td class="num" data-usage></td>
    <td data-perf></td>
  </tr>
</template>

<template id="tpl-graph">
  <section class="panel">
    <h2>
      <span data-name></span>
      <span class="target" data-target></span>
      <span class="badge" data-conn></span>
      <span class="age" data-age></span>
    </h2>
    <div data-graph></div>
  </section>
</template>

<!-- One panel per session, holding the ranking in the payload's own order. -->
<template id="tpl-perf">
  <section class="panel">
    <h2>
      <span data-name></span>
      <span class="target" data-target></span>
      <span class="badge" data-conn></span>
      <span class="age" data-age></span>
    </h2>
    <div class="stats" data-stats></div>
    <table>
      <thead><tr>
        <th class="num">#</th><th>name</th>
        <th class="num">cpu</th><th class="num">avg</th><th class="num">peak</th>
        <th>trend</th><th class="num">share</th>
        <th class="num">mem</th><th class="num">m.peak</th><th class="num">cpu s</th>
        <th class="num">throt</th><th>flags</th>
      </tr></thead>
      <tbody data-rows></tbody>
    </table>
  </section>
</template>

<template id="tpl-perf-row">
  <tr>
    <td class="num" data-rank></td><td data-name></td>
    <td class="num" data-cpu></td><td class="num" data-avg></td><td class="num" data-peak></td>
    <td data-trend></td><td class="num" data-share></td>
    <td class="num" data-mem></td><td class="num" data-mpeak></td>
    <td class="num" data-cpus></td><td class="num" data-throt></td><td data-flags></td>
  </tr>
</template>

<template id="tpl-errors">
  <section class="panel">
    <h2>
      <span>errors</span>
      <span class="badge" data-coverage></span>
      <span class="age" data-age></span>
    </h2>
    <div class="stats" data-stats></div>
    <table>
      <thead><tr>
        <th class="num">count</th><th>sev</th><th>signature</th><th>hosts</th><th>last</th>
      </tr></thead>
      <tbody data-rows></tbody>
    </table>
  </section>
</template>

<!-- One group is two rows: the signature, then its collapsed detail. -->
<template id="tpl-err-group">
  <tr class="clickable">
    <td class="num" data-count></td><td data-sev></td><td class="sig" data-sig></td>
    <td data-hosts></td><td data-last></td>
  </tr>
  <tr class="err-detail" data-detail hidden>
    <td class="sig" colspan="5"><div data-body></div></td>
  </tr>
</template>

<script>
const RATES = [2000, 5000, 10000, 30000, 60000];
const STALE_AFTER_S = 6;
// The six palette slots the TUI can write. Anything else on the wire is a
// hand-edited tags.json, and the label still has to show — in slate.
const TAG_COLORS = ['sky', 'green', 'amber', 'rose', 'violet', 'slate'];

function tagClass(color) {
  return 'tag-' + (TAG_COLORS.includes(color) ? color : 'slate');
}

function loadRate() {
  const v = Number(localStorage.getItem('vpstui.rate'));
  return RATES.includes(v) ? v : 5000;
}

// #perf, #network and #errors deep-link their tab, which beats the remembered one.
function loadTab() {
  const hash = location.hash.slice(1);
  if (hash === 'perf' || hash === 'network' || hash === 'errors' || hash === 'sessions') return hash;
  const saved = localStorage.getItem('vpstui.tab');
  return ['perf', 'network', 'errors'].includes(saved) ? saved : 'sessions';
}

let pollMs = loadRate();
let pollTimer = null;
let tab = loadTab();
let busy = false;
let ageRefs = [];
let lastPayload = '';

async function getJSON(url) {
  const res = await fetch(url, { cache: 'no-store' });
  if (!res.ok) throw new Error(url + ' -> HTTP ' + res.status);
  return res.json();
}

function node(root, key) { return root.querySelector('[data-' + key + ']'); }

function tagChip(tag, color) {
  const el = document.createElement('span');
  el.className = 'tag ' + tagClass(color);
  el.textContent = tag;
  return el;
}

function setStat(parent, label, value) {
  const s = document.createElement('span');
  s.textContent = label + ' ';
  const b = document.createElement('b');
  b.textContent = value;
  s.appendChild(b);
  parent.appendChild(s);
}

function uptime(sec) {
  if (!sec || sec <= 0) return '-';
  const d = Math.floor(sec / 86400), h = Math.floor(sec % 86400 / 3600), m = Math.floor(sec % 3600 / 60);
  return d ? d + 'd ' + h + 'h' : h ? h + 'h ' + m + 'm' : m + 'm';
}

function ageSeconds(iso) {
  const t = Date.parse(iso);
  if (Number.isNaN(t)) return null;
  return Math.max(0, (Date.now() - t) / 1000);
}

// Thresholds match the TUI's pctCell styling (styles.go).
function fillBar(bar, pct) {
  bar.style.width = Math.min(100, Math.max(0, pct)) + '%';
  if (pct >= 90) bar.className = 'hot';
  else if (pct >= 75) bar.className = 'warm';
}

function pctCell(td, pct, text) {
  if (pct === null || pct === undefined) {
    td.textContent = text;
    return;
  }
  const bar = document.createElement('i');
  fillBar(bar, pct);
  const shell = document.createElement('span');
  shell.className = 'bar sm';
  shell.appendChild(bar);
  td.textContent = text;
  td.insertBefore(shell, td.firstChild);
}

function renderSession(s) {
  const el = document.getElementById('tpl-session').content.cloneNode(true);
  node(el, 'name').textContent = s.name || s.id;
  node(el, 'target').textContent = s.target;

  const conn = node(el, 'conn');
  conn.textContent = s.connected ? 'connected' : 'down';
  conn.className = 'badge ' + (s.connected ? 'ok' : 'bad');

  const ageEl = node(el, 'age');
  ageRefs.push({ el: ageEl, iso: s.fetchedAt });

  const stats = node(el, 'stats');
  if (s.hasHostStats && s.hostStats) {
    const h = s.hostStats;
    setStat(stats, 'load', [h.load1, h.load5, h.load15].map(v => (v ?? 0).toFixed(2)).join(' '));
    setStat(stats, 'cpu', String(h.numCPU || '?'));
    const used = h.memUsedMB || 0, total = h.memTotalMB || 0;
    const pct = total > 0 ? used * 100 / total : 0;
    const mem = document.createElement('span');
    mem.textContent = 'mem ';
    const bar = document.createElement('i');
    fillBar(bar, pct);
    const shell = document.createElement('span');
    shell.className = 'bar';
    shell.appendChild(bar);
    const val = document.createElement('b');
    val.textContent = Math.round(pct) + '% (' + used + '/' + total + ' MB)';
    mem.appendChild(shell);
    mem.appendChild(document.createTextNode(' '));
    mem.appendChild(val);
    stats.appendChild(mem);
    setStat(stats, 'uptime', uptime(h.uptimeSec));
  } else {
    setStat(stats, 'host stats', 'not fetched yet');
  }

  // The #perf rows are keyed by the same short container id this table already
  // shows, so the badge is the ranking's own verdict joined by id — never a
  // second threshold computed here.
  const perfById = new Map();
  for (const r of ((s.perf && s.perf.rows) || [])) perfById.set(r.id, r);

  const rows = node(el, 'rows');
  const containers = s.containers || [];
  if (!containers.length) {
    const td = document.createElement('td');
    td.colSpan = 8;
    td.className = 'empty';
    td.textContent = 'no containers reported';
    const tr = document.createElement('tr');
    tr.appendChild(td);
    rows.appendChild(tr);
  }
  for (const c of containers) {
    const tr = document.getElementById('tpl-row').content.cloneNode(true);
    const docker = c.name || c.id.slice(0, 12);
    const nameTd = node(tr, 'name');
    // Label first, docker name behind it in the dim colour — the same order and
    // the same two strings the TUI table cell holds, so the two surfaces never
    // look like they are naming different containers.
    if (c.tag) {
      nameTd.appendChild(tagChip(c.tag, c.tagColor));
      const dn = document.createElement('span');
      dn.className = 'docker';
      dn.textContent = docker;
      nameTd.appendChild(dn);
    } else {
      nameTd.textContent = docker;
    }
    node(tr, 'image').textContent = c.image;
    const st = node(tr, 'state');
    st.textContent = c.state;
    st.className = c.state === 'running' ? 'state-running'
      : c.state === 'exited' ? 'state-exited' : 'state-other';
    node(tr, 'status').textContent = c.status;
    pctCell(node(tr, 'cpu'), c.cpuPct, c.cpu);
    pctCell(node(tr, 'mem'), c.memPct, c.memPerc);
    node(tr, 'usage').textContent = c.memUsage;
    const ranked = perfById.get(c.id);
    const perfTd = node(tr, 'perf');
    if (ranked && (ranked.flags || []).length) {
      perfTd.appendChild(flagCells(ranked.flags));
    } else {
      perfTd.textContent = ranked ? '-' : '';
    }
    rows.appendChild(tr);
  }
  return el;
}

// --- Network tab: bipartite container/network graph ------------------------
const SVG_NS = 'http://www.w3.org/2000/svg';
const NAME_MAX = 14; // 11px mono glyphs are ~6.7px wide; 14 keeps ring labels apart
const CHORD = 96;    // minimum arc spacing between two nodes on a ring

function trunc(name) {
  return name.length > NAME_MAX ? name.slice(0, NAME_MAX - 1) + '…' : name;
}

// A labelled container reads as its alias on the ring; the docker name moves into
// the hover title, because a chord diagram has no room for both. The label colour
// is the tag's, which is why an untagged node keeps the plain dim class.
function ctrShown(n) { return n.tag || n.name; }
function ctrFull(n) { return n.tag ? n.tag + ' — ' + n.name : n.name; }
function ctrCls(n) { return n.tag ? 'ctr-label ' + tagClass(n.tagColor) : 'ctr-label'; }

function svgEl(tag, attrs, cls) {
  const el = document.createElementNS(SVG_NS, tag);
  for (const key in attrs) el.setAttribute(key, String(attrs[key]));
  if (cls) el.setAttribute('class', cls);
  return el;
}

// textEl attaches a <title> only when the label was shortened, so the full
// remote name stays readable on hover. Nothing here ever touches innerHTML.
function textEl(x, y, shown, full, cls, anchor) {
  const t = svgEl('text', { x: x, y: y, 'text-anchor': anchor || 'middle' }, cls);
  t.setAttribute('dominant-baseline', 'middle');
  t.textContent = shown;
  if (shown !== full) {
    const tip = document.createElementNS(SVG_NS, 'title');
    tip.textContent = full;
    t.appendChild(tip);
  }
  return t;
}

function ringRadius(count) {
  if (count <= 1) return 74;
  if (count === 2) return 88;
  return Math.max(98, Math.ceil(CHORD / (2 * Math.sin(Math.PI / count))));
}

function plural(n, word) {
  return n + ' ' + word + (n === 1 ? '' : 's');
}

// buildGraph draws clusters on a deterministic grid: networks are placed in
// name order, their members on a circle around them, and a container that
// joins several networks anchors at its first one and lines across to the rest.
function buildGraph(g) {
  const nodes = g.nodes || [], edges = g.edges || [], iso = g.isolated || [];
  const nets = nodes.filter(n => n.kind === 'network');
  const byId = new Map(nodes.map(n => [n.id, n]));
  const members = new Map(); // network id → container ids
  for (const e of edges) {
    if (!byId.has(e.from) || !byId.has(e.to)) continue;
    let arr = members.get(e.to);
    if (!arr) { arr = []; members.set(e.to, arr); }
    arr.push(e.from);
  }
  const anchor = new Map(), ring = new Map(); // container → network, network → ring slots
  for (const n of nets) ring.set(n.id, []);
  for (const n of nets) {
    for (const id of members.get(n.id) || []) {
      if (anchor.has(id)) continue;
      anchor.set(id, n.id);
      ring.get(n.id).push(id);
    }
  }

  const radii = nets.map(n => ringRadius(ring.get(n.id).length));
  const maxR = radii.length ? Math.max.apply(null, radii) : 0;
  const cellW = 2 * (maxR + 62), cellH = 2 * (maxR + 44);
  const cols = nets.length ? Math.ceil(Math.sqrt(nets.length)) : 0;
  const rows = nets.length ? Math.ceil(nets.length / cols) : 0;
  const pad = 24, gridW = cols * cellW, gridH = rows * cellH;

  const pos = new Map(); // node id → {x, y}
  nets.forEach((n, i) => {
    pos.set(n.id, {
      x: pad + (i % cols) * cellW + cellW / 2,
      y: pad + Math.floor(i / cols) * cellH + cellH / 2
    });
  });
  for (const n of nets) {
    const c = pos.get(n.id), ids = ring.get(n.id), R = ringRadius(ids.length);
    ids.forEach((id, i) => {
      const a = -Math.PI / 2 + i * 2 * Math.PI / ids.length;
      pos.set(id, { x: c.x + R * Math.cos(a), y: c.y + R * Math.sin(a) });
    });
  }

  const isoCols = Math.max(1, Math.floor(Math.max(gridW, 336) / 168));
  const isoRows = Math.ceil(iso.length / isoCols);
  const gap = nets.length && iso.length ? 26 : 0;
  const stripTop = pad + gridH + gap;
  const W = pad * 2 + Math.max(gridW, iso.length ? isoCols * 168 : 0);
  const H = pad * 2 + gridH + gap + (iso.length ? 30 + isoRows * 26 : 0);

  const svg = svgEl('svg', { width: Math.ceil(W), height: Math.ceil(H) });
  for (const e of edges) {
    const a = pos.get(e.from), b = pos.get(e.to);
    if (!a || !b) continue;
    svg.appendChild(svgEl('line', { x1: a.x, y1: a.y, x2: b.x, y2: b.y }, 'edge'));
  }
  for (const n of nets) {
    const p = pos.get(n.id);
    const w = Math.min(170, trunc(n.name).length * 6.7 + 18);
    svg.appendChild(svgEl('rect', { x: p.x - w / 2, y: p.y - 10, width: w, height: 20, rx: 3 }, 'net-box'));
    svg.appendChild(textEl(p.x, p.y, trunc(n.name), n.name, 'net-label'));
  }
  for (const [id, p] of pos) {
    const n = byId.get(id);
    if (!n || n.kind !== 'container') continue;
    svg.appendChild(svgEl('circle', { cx: p.x, cy: p.y, r: 4 }, n.state === 'running' ? 'dot ok' : 'dot bad'));
    svg.appendChild(textEl(p.x, p.y + 16, trunc(ctrShown(n)), ctrFull(n), ctrCls(n)));
  }
  if (iso.length) {
    svg.appendChild(textEl(pad, stripTop + 10, 'no user-defined network', 'no user-defined network', 'strip-label', 'start'));
    iso.forEach((n, i) => {
      const x = pad + (i % isoCols) * 168, y = stripTop + 34 + Math.floor(i / isoCols) * 26;
      svg.appendChild(svgEl('circle', { cx: x + 4, cy: y, r: 4 }, n.state === 'running' ? 'dot ok' : 'dot bad'));
      svg.appendChild(textEl(x + 14, y, trunc(ctrShown(n)), ctrFull(n), ctrCls(n), 'start'));
    });
  }

  const linked = anchor.size;
  let note = nets.length
    ? plural(nets.length, 'network') + ' · ' + plural(linked, 'container') + ' linked'
    : 'no user-defined networks';
  if (iso.length) note += ' · ' + plural(iso.length, 'container') + ' without one';
  if (g.truncated) note += ' · showing the first ' + nodes.length + ' nodes';
  return { svg: nets.length || iso.length ? svg : null, note: note };
}

function renderNetwork(summary, g) {
  const el = document.getElementById('tpl-graph').content.cloneNode(true);
  node(el, 'name').textContent = summary.name || summary.id;
  node(el, 'target').textContent = summary.target;
  const conn = node(el, 'conn');
  conn.textContent = summary.connected ? 'connected' : 'down';
  conn.className = 'badge ' + (summary.connected ? 'ok' : 'bad');
  const body = node(el, 'graph');
  if (!g.available) {
    const p = document.createElement('p');
    p.className = 'empty';
    p.textContent = 'containers not fetched yet';
    body.appendChild(p);
    return el;
  }
  ageRefs.push({ el: node(el, 'age'), iso: g.fetchedAt });

  const built = buildGraph(g);
  const note = document.createElement('p');
  note.className = 'note';
  note.textContent = built.note;
  body.appendChild(note);
  if (built.svg) {
    const wrap = document.createElement('div');
    wrap.className = 'graph';
    wrap.appendChild(built.svg);
    body.appendChild(wrap);
  }
  return el;
}

function setStatus(text, bad) {
  const el = document.getElementById('status');
  el.textContent = text;
  el.className = bad ? 'bad' : '';
}

// renderAges rewrites only the age labels, so they count smoothly between
// polls instead of jumping when the panels are rebuilt.
function renderAges() {
  for (const { el, iso } of ageRefs) {
    const age = ageSeconds(iso);
    if (age === null) {
      el.textContent = '';
      continue;
    }
    el.textContent = age < 5 ? 'updated just now' : 'updated ' + Math.round(age) + 's ago';
    el.className = 'age' + (age > STALE_AFTER_S ? ' stale' : '');
  }
}

function emptyPanel(text) {
  const p = document.createElement('p');
  p.className = 'panel empty';
  p.textContent = text;
  return p;
}

function rebuild(panels) {
  document.getElementById(tab).replaceChildren(...panels);
  renderAges();
}

const NO_SESSIONS = 'Connect a host in the vpstui TUI to publish its data here.';

async function tickSessions(list) {
  const details = await Promise.all(
    list.map(s => getJSON('/api/sessions/' + encodeURIComponent(s.id)).catch(() => null))
  );
  const payload = JSON.stringify(details);
  // Skip the repaint entirely when nothing changed; a full rebuild is what
  // makes the page flicker and clears any selected text.
  if (payload !== lastPayload) {
    lastPayload = payload;
    ageRefs = [];
    rebuild(details.filter(Boolean).map(renderSession));
  } else {
    renderAges();
  }
  const shown = details.filter(Boolean).length;
  const containers = details.reduce((n, d) => n + ((d && d.containers) ? d.containers.length : 0), 0);
  setStatus('live · ' + plural(shown, 'session') + ' · ' + plural(containers, 'container'), false);
}

async function tickNetwork(list) {
  const graphs = await Promise.all(
    list.map(s => getJSON('/api/sessions/' + encodeURIComponent(s.id) + '/network').catch(() => null))
  );
  const pairs = [];
  list.forEach((s, i) => { if (graphs[i]) pairs.push([s, graphs[i]]); });
  const payload = JSON.stringify(pairs);
  if (payload !== lastPayload) {
    lastPayload = payload;
    ageRefs = [];
    rebuild(pairs.map(([s, g]) => renderNetwork(s, g)));
  } else {
    renderAges();
  }
  const nets = pairs.reduce((n, [, g]) => n + (g.nodes || []).filter(x => x.kind === 'network').length, 0);
  setStatus('live · ' + plural(pairs.length, 'session') + ' · ' + plural(nets, 'network'), false);
}

// --- Performance tab: the ranking the terminal computed --------------------

// Nothing here sorts, thresholds or compares against a constant: Go publishes the
// order, the flags and the denominators, and the page prints them. A hog on the
// screen is a hog here because both surfaces read the same reduce.

const SPARK_W = 120, SPARK_H = 22;
// The only badges internal/perf can write. A class name is built from this, so
// anything unexpected on the wire renders as a plain word, not a selector.
const PERF_FLAGS = ['hog', 'spike'];

function trimZero(v) {
  return v.toFixed(2).replace(/0+$/, '').replace(/\.$/, '');
}

// fmtBytes mirrors perf.Bytes, so one reading carries the same text on both
// surfaces. Absence is '-', never a 0 that would read as a measurement.
function fmtBytes(n) {
  if (n === null || n === undefined || n < 0) return '-';
  const steps = [[1024 * 1024 * 1024 * 1024, 'TiB'], [1024 * 1024 * 1024, 'GiB'], [1024 * 1024, 'MiB'], [1024, 'KiB']];
  for (const [m, u] of steps) {
    if (n >= m) return trimZero(n / m) + u;
  }
  return n + 'B';
}

function fmtPct(v) {
  return v === null || v === undefined ? '-' : v.toFixed(1) + '%';
}

function fmtCpuSeconds(sec) {
  if (sec === null || sec === undefined) return '-';
  if (sec < 90) return trimZero(sec) + 's';
  if (sec < 5400) return Math.round(sec / 60) + 'm';
  return (sec / 3600).toFixed(1) + 'h';
}

function fmtWindow(sec) {
  if (sec === null || sec === undefined) return '-';
  return sec < 60 ? Math.round(sec) + 's' : Math.round(sec / 60) + 'm';
}

// fmtThrottle keeps the terminal's distinction between "never throttled" and "this
// host exposes no counter": 0 prints 0, nothing prints '-'.
function fmtThrottle(r) {
  if (r.throttled === null || r.throttled === undefined) return '-';
  if (r.throttled === 0) return '0';
  return r.throttled + '/' + (r.periods === null || r.periods === undefined ? '?' : r.periods);
}

function flagSpan(f) {
  const el = document.createElement('span');
  const name = String(f);
  el.className = 'flag ' + (PERF_FLAGS.includes(name) ? name : 'other');
  el.textContent = name.toUpperCase();
  return el;
}

function flagCells(flags) {
  const frag = document.createDocumentFragment();
  for (const f of flags || []) frag.appendChild(flagSpan(f));
  return frag;
}

// sparkline draws the same window the terminal sparkled: oldest point left, scaled
// to this container's own peak, because "did it spike" is a question about its
// baseline and not the machine's. The values arrive already downsampled by Go.
function sparkline(vals, peak) {
  if (!vals || vals.length < 2) return null;
  const lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
  const top = hi > lo ? hi : lo + 1; // a flat window still needs a line to sit on
  const svg = svgEl('svg', { width: SPARK_W, height: SPARK_H }, 'spark');
  const tip = document.createElementNS(SVG_NS, 'title');
  tip.textContent = 'peak ' + fmtPct(peak);
  svg.appendChild(tip);
  const step = (SPARK_W - 2) / (vals.length - 1);
  const pts = vals.map((v, i) => {
    const x = 1 + i * step;
    const y = SPARK_H - 1 - (Math.max(0, v - lo) / (top - lo)) * (SPARK_H - 2);
    return x.toFixed(1) + ',' + y.toFixed(1);
  }).join(' ');
  svg.appendChild(svgEl('polyline', { points: pts }, 'spark-line'));
  return svg;
}

function perfEmpty(el, rows, text) {
  const td = document.createElement('td');
  td.colSpan = 12;
  td.className = 'empty';
  td.textContent = text;
  const tr = document.createElement('tr');
  tr.appendChild(td);
  rows.appendChild(tr);
}

function renderPerf(s) {
  const el = document.getElementById('tpl-perf').content.cloneNode(true);
  node(el, 'name').textContent = s.name || s.id;
  node(el, 'target').textContent = s.target;
  const conn = node(el, 'conn');
  conn.textContent = s.connected ? 'connected' : 'down';
  conn.className = 'badge ' + (s.connected ? 'ok' : 'bad');
  ageRefs.push({ el: node(el, 'age'), iso: s.fetchedAt });

  const stats = node(el, 'stats');
  const rows = node(el, 'rows');
  const p = s.perf;
  if (!p || !(p.rows || []).length) {
    // Every denominator the numbers would have needed, stated as missing.
    setStat(stats, 'window', 'no samples yet');
    perfEmpty(el, rows, 'the TUI has not buffered a stats tick for this host yet');
    return el;
  }
  const h = s.hostStats || {};
  setStat(stats, 'cpu', h.numCPU ? String(h.numCPU) : '?');
  setStat(stats, 'ram', h.memTotalMB ? fmtBytes(h.memTotalMB * 1024 * 1024) : '?');
  setStat(stats, 'window', fmtWindow(p.windowSec));
  setStat(stats, 'kept', fmtWindow(p.retentionSec));
  setStat(stats, 'samples', String(p.samples));
  if (!p.probed) {
    setStat(stats, 'all-time', 'not probed — press f in the TUI');
  } else if (!p.supported) {
    setStat(stats, 'all-time', (s.name || s.id) + ': cgroup peak not available');
  } else {
    // errTime is the clock the errors tab uses, so two panels about one host never
    // date the same instant differently.
    setStat(stats, 'probed', errTime(p.probedAt));
  }

  p.rows.forEach((r, i) => {
    const tr = document.getElementById('tpl-perf-row').content.cloneNode(true);
    node(tr, 'rank').textContent = String(i + 1);
    const nameTd = node(tr, 'name');
    nameTd.textContent = r.name || r.id;
    nameTd.title = r.id; // the join key, readable on hover, never guessed
    node(tr, 'cpu').textContent = fmtPct(r.cpu);
    node(tr, 'avg').textContent = fmtPct(r.cpuAvg);
    node(tr, 'peak').textContent = fmtPct(r.cpuPeak);
    const trend = node(tr, 'trend');
    const spark = sparkline(r.series, r.cpuPeak);
    if (spark) trend.appendChild(spark); else trend.textContent = '-';
    node(tr, 'share').textContent = fmtPct(r.share);
    node(tr, 'mem').textContent = fmtBytes(r.memBytes);
    const mpeak = node(tr, 'mpeak');
    mpeak.textContent = fmtBytes(r.allTimeMemPeakBytes);
    mpeak.title = 'window peak ' + fmtBytes(r.memPeakBytes);
    const cpus = node(tr, 'cpus');
    cpus.textContent = fmtCpuSeconds(r.cpuSeconds);
    // A total is not a cost until it is a rate: 64 minutes over a week is idle
    // noise, over ten minutes it is a core. Go divides by the container's own
    // lifetime, so the cell says which and holds the other on hover.
    if (r.cpuAvgCores !== null && r.cpuAvgCores !== undefined) {
      // A rate under a hundredth of a core is not "0 cores" — that would read as a
      // measurement of idle, which is a stronger claim than "<0.01" and can be false.
      const rate = r.cpuAvgCores < 0.005 ? '<0.01' : trimZero(r.cpuAvgCores);
      cpus.title = rate + ' cores averaged over its life';
    }
    node(tr, 'throt').textContent = fmtThrottle(r);
    node(tr, 'flags').appendChild(flagCells(r.flags));
    rows.appendChild(tr);
  });
  return el;
}

async function tickPerf(list) {
  // The ranking travels inside the session payload, so this is the same one fetch
  // per host the sessions tab makes — no second endpoint, no second opinion.
  const details = await Promise.all(
    list.map(s => getJSON('/api/sessions/' + encodeURIComponent(s.id)).catch(() => null))
  );
  const shown = details.filter(Boolean);
  const payload = JSON.stringify(shown);
  if (payload !== lastPayload) {
    lastPayload = payload;
    ageRefs = [];
    rebuild(shown.map(renderPerf));
  } else {
    renderAges();
  }
  const rowsOf = d => (d.perf && d.perf.rows) ? d.perf.rows : [];
  const ranked = shown.reduce((n, d) => n + rowsOf(d).length, 0);
  const hogs = shown.reduce((n, d) => n + rowsOf(d).filter(r => (r.flags || []).includes('hog')).length, 0);
  setStatus('live · ' + plural(shown.length, 'session') + ' · ' + plural(ranked, 'ranked') +
    ' · ' + plural(hogs, 'hog'), false);
}

// --- Errors tab: the cross-host signature aggregate ------------------------

// errTime mirrors the TUI's errTime: today gets a clock, anything older a date.
function errTime(iso) {
  const t = Date.parse(iso);
  if (Number.isNaN(t)) return '—';
  const d = new Date(t), now = new Date();
  const p = n => String(n).padStart(2, '0');
  const clock = p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
  if (d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth() && d.getDate() === now.getDate()) {
    return clock;
  }
  return p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + clock.slice(0, 5);
}

function div(cls, text) {
  const el = document.createElement('div');
  el.className = cls;
  el.textContent = text;
  return el;
}

// sampleLine and groupText rebuild, byte for byte, the two strings the TUI's y and
// Y write to the clipboard: a raw line that greps on the host (docker names, not
// labels), and a signature header a human reads (labels, because it is for reading).
// The API publishes one representative sample per group, so the page's group copy
// carries the header plus that line; the TUI appends every line it retained.
function sampleLine(s) {
  if (!s) return '';
  return s.host + '/' + s.container + ' ' + (s.stamp || '—') + ' ' + s.sev + ' ' + s.text;
}

function groupText(g) {
  const head = g.sig + '  (' + g.sev + ', ' + g.count + '×, ' +
    (g.containers || []).join(' + ') + ', ' + errTime(g.firstSeen) + ' → ' + errTime(g.lastSeen) + ')';
  // The API publishes the newest lines behind the signature, oldest first, so a
  // copied group is the same text the TUI's Y writes: header for the human, raw
  // docker lines for grep on the host.
  const lines = (g.examples && g.examples.length ? g.examples : [g.sample])
    .map(sampleLine).filter(Boolean);
  return lines.length ? head + '\n' + lines.join('\n') : head;
}

// Text is assembled from JSON fields and handed to the clipboard as a string. It
// never enters the document, so remote log text cannot become markup.
function copyButton(text, label, tip) {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'copy';
  b.textContent = label;
  if (tip) b.title = tip;
  // The group row toggles its own pane on click, so the button swallows the event.
  b.addEventListener('click', (ev) => { ev.stopPropagation(); copyText(text); });
  return b;
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    setStatus('copied ' + plural(text.split('\n').length, 'line'), false);
  } catch (err) {
    setStatus('copy failed — the browser denied clipboard access', true);
  }
}

function renderErrors(e) {
  const el = document.getElementById('tpl-errors').content.cloneNode(true);
  const hosts = e.hosts || [], groups = e.groups || [];

  const cov = node(el, 'coverage');
  cov.textContent = e.swept + ' of ' + hosts.length + ' hosts swept';
  cov.className = 'badge ' + (e.swept ? 'ok' : 'bad');
  ageRefs.push({ el: node(el, 'age'), iso: e.fetchedAt });

  const stats = node(el, 'stats');
  setStat(stats, 'lines', String(e.lineCount || 0));
  setStat(stats, 'signatures', String(groups.length));
  setStat(stats, 'connected', String(e.connected || 0));
  if (e.truncated) {
    setStat(stats, 'note', 'older lines were dropped — widen VPSTUI_ERR_SINCE or VPSTUI_ERR_TAIL');
  }
  // Coverage is spelled out per host: an unvisited host contributes nothing,
  // and silently omitting it would read as a clean machine.
  for (const h of hosts) {
    setStat(stats, h.name, h.swept ? plural(h.lineCount, 'line') + ' @ ' + errTime(h.sweptAt) : 'not swept');
  }

  const rows = node(el, 'rows');
  if (!groups.length) {
    const td = document.createElement('td');
    td.colSpan = 5;
    td.className = 'empty';
    td.textContent = e.swept
      ? 'no errors or warnings in the swept window'
      : 'nothing swept yet — open vpstui, then press a and r';
    const tr = document.createElement('tr');
    tr.appendChild(td);
    rows.appendChild(tr);
  }
  for (const g of groups) {
    const frag = document.getElementById('tpl-err-group').content.cloneNode(true);
    const tr = frag.querySelector('tr.clickable');
    const detail = frag.querySelector('[data-detail]');
    node(tr, 'count').textContent = String(g.count);
    const sev = node(tr, 'sev');
    sev.textContent = g.sev;
    sev.className = g.sev === 'error' ? 'sev-error' : g.sev === 'warn' ? 'sev-warn' : 'sev-other';
    const sig = node(tr, 'sig');
    sig.textContent = g.sig;
    sig.appendChild(copyButton(groupText(g), 'copy', 'copy this signature and its newest line'));
    node(tr, 'hosts').textContent = (g.hosts || []).join(', ');
    node(tr, 'last').textContent = errTime(g.lastSeen);
    const body = node(detail, 'body');
    body.appendChild(div('where', 'containers: ' + (g.containers || []).join(', ') +
      ' · first ' + errTime(g.firstSeen) + ' · last ' + errTime(g.lastSeen)));
    const s = g.sample;
    const line = div('sample', s
      ? '[' + s.host + '] ' + (s.tag ? s.tag + ' ' : '') + s.container +
        (s.stamp ? ' ' + s.stamp : '') + '  ' + s.text
      : 'no sample published');
    body.appendChild(line);
    // The label reads before the docker name, in plain text — the same shape the
    // TUI's expand pane prints, where the name stays searchable and colour is
    // reserved for severity.
    if (s) {
      line.appendChild(copyButton(sampleLine(s), 'copy line', 'copy just this log line'));
    }
    tr.addEventListener('click', () => { detail.hidden = !detail.hidden; });
    rows.appendChild(frag);
  }
  return el;
}

// One request per poll: the reduce across sessions happens server-side, so this
// tab does not fetch per session like the other two.
async function tickErrors() {
  let e;
  try {
    e = await getJSON('/api/errors');
  } catch (err) {
    setStatus('api unreachable — is vpstui running? (' + err.message + ')', true);
    return;
  }
  const payload = JSON.stringify(e);
  if (payload !== lastPayload) {
    lastPayload = payload;
    ageRefs = [];
    rebuild([renderErrors(e)]);
  } else {
    renderAges();
  }
  setStatus('live · ' + plural(e.swept, 'host') + ' swept · ' +
    plural((e.groups || []).length, 'signature'), false);
}

async function tick() {
  if (busy) return; // never overlap a slow poll with the next one
  busy = true;
  try {
    let list;
    try {
      list = await getJSON('/api/sessions');
    } catch (err) {
      setStatus('api unreachable — is vpstui running? (' + err.message + ')', true);
      return;
    }
    if (!list.length) {
      if (lastPayload !== '[]') {
        lastPayload = '[]';
        ageRefs = [];
        rebuild([emptyPanel(NO_SESSIONS)]);
      }
      setStatus('live · no connected sessions', false);
      return;
    }
    if (tab === 'perf') await tickPerf(list);
    else if (tab === 'network') await tickNetwork(list);
    else if (tab === 'errors') await tickErrors();
    else await tickSessions(list);
  } finally {
    busy = false;
  }
}

function applyRate(ms) {
  pollMs = ms;
  localStorage.setItem('vpstui.rate', String(ms));
  clearInterval(pollTimer);
  pollTimer = setInterval(tick, pollMs);
}

function paintTab() {
  document.getElementById('sessions').hidden = tab !== 'sessions';
  document.getElementById('perf').hidden = tab !== 'perf';
  document.getElementById('network').hidden = tab !== 'network';
  document.getElementById('errors').hidden = tab !== 'errors';
  for (const b of document.querySelectorAll('#tabs button')) {
    b.className = b.dataset.tab === tab ? 'active' : '';
  }
}

// Each tab renders a different payload, so switching drops the cached one
// rather than comparing against another view's JSON.
function switchTab(next) {
  tab = next;
  localStorage.setItem('vpstui.tab', next);
  lastPayload = '';
  ageRefs = [];
  paintTab();
  tick();
}

const rateSel = document.getElementById('rate');
for (const ms of RATES) {
  const opt = document.createElement('option');
  opt.value = String(ms);
  opt.textContent = ms / 1000 + 's';
  rateSel.appendChild(opt);
}
rateSel.value = String(pollMs);
rateSel.addEventListener('change', () => applyRate(Number(rateSel.value)));
for (const b of document.querySelectorAll('#tabs button')) {
  b.addEventListener('click', () => switchTab(b.dataset.tab));
}

setInterval(renderAges, 1000);
paintTab();
applyRate(pollMs);
tick();
</script>
</body>
</html>
