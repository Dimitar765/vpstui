id: plausible
name: Plausible
description: Lightweight, open-source web analytics — no cookies, GDPR-compliant.
category: analytics
logo: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/plausible.png
type: compose
port: 8000
public_service: plausible
compose: |
  services:
    plausible:
      image: plausible/analytics:v2.1
      command: sh -c "sleep 10 && /entrypoint.sh db createdb && /entrypoint.sh db migrate && /entrypoint.sh run"
      restart: unless-stopped
      depends_on:
        - clickhouse
        - postgres
      environment:
        BASE_URL: http://localhost:8000
        SECRET_KEY_BASE: change-me-to-a-random-64-char-string
        DATABASE_URL: postgres://postgres:postgres@postgres:5432/plausible_db
        CLICKHOUSE_DATABASE_URL: http://clickhouse:8123/plausible_events_db
        DISABLE_REGISTRATION: "true"
    clickhouse:
      image: clickhouse/clickhouse-server:24.3-alpine
      restart: unless-stopped
      ulimits:
        nofile:
          soft: 262144
          hard: 262144
      volumes:
        - "{{id}}-events:/var/lib/clickhouse"
      environment:
        CLICKHOUSE_DB: plausible_events_db
        CLICKHOUSE_USER: clickhouse
        CLICKHOUSE_PASSWORD: clickhouse
    postgres:
      image: postgres:16-alpine
      restart: unless-stopped
      volumes:
        - "{{id}}-db:/var/lib/postgresql/data"
      environment:
        POSTGRES_DB: plausible_db
        POSTGRES_PASSWORD: postgres
